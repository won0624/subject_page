<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>듀얼센스 컬렉션</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans KR", sans-serif;
        }

        section {
            position: relative;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            background-color: rgb(255, 255, 255);
            padding: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo {
            position: relative;
            max-width: 80px;
        }

        header ul {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header ul li {
            list-style: none;
            align-items: center;
            background-color: #0070CC;
            border-radius: 40px;
            padding: 6px 15px;
            transition: 0.3s;
        }

        header ul li:hover {
            transform: scale(1.1);
        }


        

        header ul li a {
            font-size: 12pt;
            color: white;
            text-decoration: none;
        }


        header ul li img {
            display: block;
            object-fit: contain;
            width: 24px;
            background-color: #0070CC;
            ;
            border-radius: 40px;
        }

        .content {
            position: relative;
            top: -200px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content .textbox {
            position: relative;
            max-width: 1600px;
            font-size: 1vw;
        }
        .content .textbox h2 {
            color: #333;
            max-width: 1600px;
            font-size: 3em;
            line-height: 1.5;
            font-weight: 500;
        }
        

        .content .textbox a {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: #0070CC;
            color: white;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 1px;
            text-decoration: none;
            transition: 0.3s;
        }
        .content .textbox a:hover {
            transform: scale(1.2);
        }

        .content .imgbox {
            width: 600px;
            display: flex;
            justify-content: flex-end;
            margin-right: -100px;
            margin-top: 50px;

        }

        .content .imgbox img {
            max-width: 600px
        }

        .thumb {
            position: absolute;
            left: 50%;
            bottom: 300px;
            display: flex;
            transform: translateX(-50%);
        }
        
        .thumb li {
            list-style: none;
            margin: 0 20px;
            cursor: pointer;
            transition: .3s;
        }
        .thumb li:hover {
            transform: scale(1.2)
            translateY(-10px)
        }
        .thumb li img {
            max-width: 60px;
            border: 2px solid white;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .sci {
            position: absolute;
            top: 39%;
            right: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .sci li {
            list-style: none;
        }
        .circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #56a6e8;
            clip-path: circle(350px at right 520px);
        }

    </style>
</head>
<body>
    <section>

        <div class="circle"></div>
        <header>
            <a href="" class="logo"><img src="ps_imgs/ps_logo.png" alt=""></a>
            <ul>
                <li><a href="">로그인</a></li>
                
                <li><img src="ps_imgs/search2.png" alt=""></li>
                
            </ul>
        </header>
        <div class="content">
            <div class="textbox">
                <h2>혁신적인 DualSense® 컨트롤러로<br>새로운 경험을 만끽하세요.</h2>
                <p></p>
                    <a href="">더 알아보기</a>
            </div>
            <div class="imgbox">
                <img src="ps_imgs/white.png" alt="" class="dualsense">
            </div>
        </div>
        <ul class="thumb">
            <li><img src="ps_imgs/듀얼센스 분류 하이퍼 팝.png" alt="" onclick="imgSlider('./ps_imgs/technored2.png');changeCircleColor('#FF7D70')"></li>
            <li><img src="ps_imgs/듀얼센스 분류 크로마.png" alt="" onclick="imgSlider('./ps_imgs/chromaindigo2.png');changeCircleColor('#70A2FF')"></li>
            <li><img src="ps_imgs/듀얼센스 분류 딥 어쓰.png" alt="" onclick="imgSlider('./ps_imgs/sterlingsilver2.png');changeCircleColor('#E0E0E0')"></li>
            <li><img src="ps_imgs/듀얼센스 분류 갤럭시.png" alt="" onclick="imgSlider('./ps_imgs/galacticpurple2.png');changeCircleColor('#B4A3FF')"></li>
        </ul>
        <ul class="sci">
            <li><a href=""><img src="imgs/facebook.png" alt=""></a></li>
            <li><a href=""><img src="imgs/twitter.png" alt=""></a></li>
            <li><a href=""><img src="imgs/instagram.png" alt=""></a></li>
        </ul>

        <div class="category-container">

    
    </section>

    <script>
        function imgSlider(anything) {
            document.querySelector('.dualsense').src = anything;
        }

        function changeCircleColor(color) {
            const circle = document.querySelector('.circle');
            circle.style.backgroundColor = color;
        }
    </script>
</body>
</html>
